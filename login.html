        /* Additional styles for login page */
        body {
            background: linear-gradient(135deg, #e3e6f3 0%, #f5f5f5 100%);
            font-family: "Spartan", sans-serif;
        }
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-form {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            transition: box-shadow 0.3s ease, opacity 0.5s ease;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-form:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }
        .auth-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #088178;
            font-size: 28px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #088178;
            box-shadow: 0 0 0 3px rgba(8, 129, 120, 0.1);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #088178 0%, #065a52 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .auth-btn:hover {
            background: linear-gradient(135deg, #065a52 0%, #044a44 100%);
            transform: translateY(-2px);
        }
        .auth-btn:active {
            transform: translateY(0);
        }
        .toggle-link {
            text-align: center;
            margin-top: 25px;
        }
        .toggle-link a {
            color: #088178;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .toggle-link a:hover {
            color: #065a52;
            text-decoration: underline;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            padding: 10px;
            border-radius: 5px;
            transition: opacity 0.3s ease;
        }
        .message.success {
            color: #28a745;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        @media (max-width: 477px) {
            .auth-form {
                padding: 25px;
                margin: 10px;
            }
            .auth-form h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

            <h2>Login</h2>
            <form id="loginForm">

                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="auth-btn">Login</button>
            </form>
            <div class="toggle-link">
                <a href="#" id="show-register">Don't have an account? Register</a>
            </div>
            <div id="login-message" class="message"></div>
        </div>

        <div class="auth-form" id="register-form" style="display: none;">
            <h2>Register</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">Confirm Password</label>
                    <input type="password" id="register-confirm-password" required>
                </div>
                <button type="submit" class="auth-btn">Register</button>
            </form>
            <div class="toggle-link">
                <a href="#" id="show-login">Already have an account? Login</a>
            </div>
            <div id="register-message" class="message"></div>
        </div>
    </section>

    <script>
        let users = JSON.parse(localStorage.getItem('users')) || [];

        // Load users from server and merge
        fetch('http://localhost:3003/users')
            .then(response => response.json())
            .then(data => {
                // Merge server users with local
                const serverUsers = data;
                const localUsers = JSON.parse(localStorage.getItem('users')) || [];
                // Use server as primary, add local if not in server
                const merged = [...serverUsers];
                localUsers.forEach(lu => {
                    if (!merged.find(su => su.username === lu.username)) {
                        merged.push(lu);
                    }
                });
                users = merged;
                localStorage.setItem('users', JSON.stringify(users));
            })
            .catch(error => {
                console.error('Error loading users from server:', error);
                // Keep localStorage users
            });

        // No embedded users in window.data

        // Toggle between login and register forms
        document.getElementById('show-register').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('register-message').textContent = '';
            document.getElementById('register-message').classList.remove('error');
        });

        document.getElementById('show-login').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('login-message').textContent = '';
            document.getElementById('login-message').classList.remove('error');
        });

        // Registration
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            // Validate password match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            // Password validation
if (
    password.length < 8 ||
    !/(?=.*[a-z])/.test(password) ||      // lowercase
    !/(?=.*[A-Z])/.test(password) ||      // uppercase
    !/(?=.*\d)/.test(password) ||         // number
    !/(?=.*[@$!%*?&])/.test(password) ||  // special character
    /\s/.test(password)                   // no spaces
) {
    alert(
        `Password must be at least 8 characters long and contain:
         One uppercase letter\n 
         One lowercase letter\n 
         One number\n
         One special character\n 
         No spaces`
    );
    return;
}


            // Check if user already exists
            const existingUser = users.find(user => user.username === username);
            if (existingUser) {
                document.getElementById('register-message').textContent = 'Username already exists!';
                document.getElementById('register-message').classList.add('error');
                return;
            }

            // Check banned users on server (by username or email)
            // Removed banned check as endpoint doesn't exist

            // Store user
            const newUser = { username, email, password };
            // Try server first
            fetch('http://localhost:3003/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newUser)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Server error');
                }
            })
            .then(serverUser => {
                // Success with server
                users.push(serverUser);
                localStorage.setItem('users', JSON.stringify(users));
                document.getElementById('register-message').textContent = 'Registration successful! Please login.';
                document.getElementById('register-message').classList.remove('error');
                document.getElementById('register-message').classList.add('success');
                document.getElementById('registerForm').reset();
            })
            .catch(error => {
                console.warn('Server not available, storing in localStorage:', error);
                // Fallback to localStorage
                const lsUsers = JSON.parse(localStorage.getItem('users')) || [];
                const maxId = lsUsers.reduce((m, u) => (u.id && u.id > m ? u.id : m), 0);
                const assigned = { ...newUser, id: maxId + 1 };
                lsUsers.push(assigned);
                localStorage.setItem('users', JSON.stringify(lsUsers));
                users = lsUsers;
                document.getElementById('register-message').textContent = 'Registration successful! Please login.';
                document.getElementById('register-message').classList.remove('error');
                document.getElementById('register-message').classList.add('success');
                document.getElementById('registerForm').reset();
            });
                });
            // });
        // });

        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            console.log('Users:', users);
            console.log('Attempting login with:', username, password);

            const user = users.find(user => user.username === username && user.password === password);

            if (user) {
                console.log('User found:', user);
                // Store login status
                localStorage.setItem('loggedInUser', username);
                localStorage.setItem('currentUserId', user.id);
                // Store login data in JSON
                fetch('http://localhost:3003/logins', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id, username, loginDate: new Date().toISOString() })
                })
                .then(response => response.json())
                .then(data => {
                    localStorage.setItem('currentLoginId', data.id);
                    // Update user as logged in
                    user.isLoggedIn = true;
                    return fetch(`http://localhost:3003/users/${user.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(user)
                    });
                })
                .catch(error => console.error('Error logging login:', error));
                // Redirect to home page
                window.location.href = 'index.html';
            } else {
                console.log('User not found');
                document.getElementById('login-message').textContent = 'Invalid username or password!';
                document.getElementById('login-message').classList.add('error');
            }

            // Clear form
            this.reset();
        });
    </script>
